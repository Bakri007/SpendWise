<div class="login-wrap">
  <div class="dots-bg" id="dotsBg"></div>

  <div class="login-stage">
    <img class="mascot" src="assets/images/mascot.png" alt="SpendWise mascot" />

    <div class="login-card">
      <div class="logo">Spend<span>Wise</span></div>
      <p class="subtitle">Take control of your finances</p>

      <div class="field">
        <label class="label">Email</label>
        <input class="input" type="email" [(ngModel)]="email"
               placeholder="you@example.com"
               autocomplete="off"
               (blur)="validateEmail()" />
        <p class="field-error" *ngIf="emailError">{{ emailError }}</p>
      </div>

      <div class="field">
        <label class="label">Password</label>
        <div class="password-wrap">
          <input class="input" [type]="showPassword ? 'text' : 'password'"
                 [(ngModel)]="password"
                 placeholder="••••••••"
                 autocomplete="new-password"
                 (blur)="validatePassword()" />
          <span class="eye" (click)="togglePassword()">
            <i [class]="showPassword ? 'ti ti-eye-off' : 'ti ti-eye'"></i>
          </span>
        </div>
        <p class="field-error" *ngIf="passwordError">{{ passwordError }}</p>
      </div>

      <div class="forgot" (click)="goToForgotPassword()">Forgot password?</div>

      <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>

      <button class="btn" (click)="onSubmit()">Log in</button>

      <div class="divider">
        <div class="divider-line"></div>
        <span class="divider-text">or</span>
        <div class="divider-line"></div>
      </div>

      <p class="switch">Don't have an account? <span (click)="goToRegister()">Sign up</span></p>
    </div>
  </div>
</div>
